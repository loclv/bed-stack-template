events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured logging format for Nginx
    log_format json_analytics escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json_analytics;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # ─── Rate Limiting Zones ──────────────────────────────────────────────
    # Auth zone: 10 requests per minute per IP max (for login/register)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;

    # Payment zone: 15 requests per minute per IP max (for payments/booking)
    limit_req_zone $binary_remote_addr zone=payment_zone:10m rate=15r/m;

    # General API zone: 10 requests per second per IP (for seat listings/SSE)
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=10r/s;

    # Return 429 Too Many Requests status code
    limit_req_status 429;

    server {
        listen 3000;
        server_name localhost;

        # Health checks directly on gateway
        location /health {
            return 200 '{"status":"UP","gateway":"healthy"}';
            add_header Content-Type application/json;
        }

        # ─── Authentication Service ───
        # /api/auth/register or /api/auth/login gets strict rate limiting
        location ~ ^/api/auth/(register|login)$ {
            limit_req zone=auth_zone burst=5 nodelay;
            
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://auth-service:3001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Other auth endpoints
        location /api/auth/ {
            limit_req zone=general_zone burst=20 nodelay;

            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://auth-service:3001;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Payment Service: Specific Seat Reserve Routing ───
        # /api/seats/:id/reserve is routed directly to payment service
        location ~ ^/api/seats/([^/]+)/reserve$ {
            limit_req zone=payment_zone burst=5 nodelay;

            rewrite ^/api/seats/(.*)/reserve$ /seats/$1/reserve break;
            proxy_pass http://payment-service:3003;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Webhooks matching stripe webhook URL
        location /api/payments/ {
            limit_req zone=general_zone burst=50 nodelay;

            rewrite ^/api/payments/(.*)$ /payments/$1 break;
            proxy_pass http://payment-service:3003;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Seat Service ───
        # General seat endpoints (list, lock/hold, unlock/release)
        location /api/seats {
            limit_req zone=general_zone burst=30 nodelay;

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://seat-service:3002;

            # SSE headers setup for real-time seat update stream
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
